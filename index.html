<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sounds App</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #181818);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 22px; margin: 0 0 6px 0; }
    p { font-size: 14px; color: var(--tg-theme-hint-color, #8e8e93); margin: 0 0 24px 0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 400px;
    }
    button {
      background-color: var(--tg-theme-button-color, #8774e1);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 14px;
      padding: 18px 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <h1>🎵 Sounds</h1>
  <p>Нажмите на кнопку для прослушивания</p>

  <div class="grid">
    <button onclick="playSound('sound1.ogg')">🔊 Звук 1</button>
    <button onclick="playSound('sound2.ogg')">🎶 Звук 2</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let currentAudio = null;

    function playSound(fileName) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(fileName);
      currentAudio.play();
    }
  </script>
</body>
</html>
